# ╭────────────────────────────────╮
# │  █▄    ▄█  Watchoo             │
# │  █ ●██● █  Workspace settings  │
# │  ▀██▙▟██▀                      │
# ╰────────────────────────────────╯
#
# Watchoo workspace settings.
#
# Only the workspace name is active. The other settings are in comments,
# with their default value: to change one for this workspace only,
# remove the "#" in front of its section (e.g. "sync:") and in front of its line.
#
# Order of precedence, from lowest to highest:
#   1. Watchoo's defaults;
#   2. the user's settings, shared by all their workspaces (optional):
#      $XDG_CONFIG_HOME/watchoo/config.yaml, or ~/.config/watchoo/config.yaml;
#   3. this file;
#   4. environment variables WATCHOO_<SECTION>_<KEY> (e.g. WATCHOO_SYNC_INTERVAL=1h),
#      then the command-line options.
#
# An unknown key is refused, to catch typos.
# No token here: Watchoo gets it from "gh auth token" and never stores it.

# Workspace name, shown in the web UI, the TUI and "watchoo status".
# Default: the name of the workspace directory.
name: "licence-projet"

# Automatic synchronization, performed by "watchoo serve" and "watchoo tui".
# "watchoo sync" remains available at any time.
# sync:
#   auto: true               # false: manual sync only
#   interval: 30m            # duration (15m, 1h…), at least 15m; 0: manual sync only
#   parallelism: 4           # repositories synced at the same time, from 1 to 4

# Activity thresholds of the workspace, in days without a commit.
# activity:
#   flemme_after_days: 5     # beyond: "Slacking" (at least 1)
#   dead_after_days: 15      # beyond: "Dead" (greater than flemme_after_days)

# Ignored branches, by pattern (path.Match syntax).
# branches:
#   exclude: []              # e.g. ["dependabot/*", "renovate/*"]

# Web interface ("watchoo serve"). Listening anywhere other than 127.0.0.1
# would expose private repository data: authentication becomes mandatory
# (auth.username and the WATCHOO_WEB_PASSWORD variable, never in this file,
# or trusted_proxy: true behind an authenticating reverse proxy, with its public
# names in allowed_hosts: the Host header is always checked, against DNS rebinding).
# web:
#   addr: "127.0.0.1:8080"   # host:port
#   trusted_proxy: false     # true: an authenticating reverse proxy protects access
#   allowed_hosts: []        # public names accepted in Host, e.g. ["watchoo.example.org"]
#   auth:
#     username: ""           # basic authentication; password in WATCHOO_WEB_PASSWORD

# Time zone used for display and grouping by day or by week.
# timezone: ""               # empty: system time zone; otherwise an IANA name, e.g. "Europe/Paris"

# Language of the web interface (the CLI and the TUI follow WATCHOO_LANG or the system locale).
# lang: "en"                 # "en" (English) or "fr" (French)

# Access to the GitHub API through the gh CLI, when it is installed and signed in. With
# GH_TOKEN (Docker, CI), leave user empty: "gh auth token --user" ignores GH_TOKEN.
# github:
#   user: ""                 # exact login of a gh account; empty: gh's active account
#   gh_path: "gh"            # absolute path, or a name looked up in the PATH

# Without gh installed and signed in, repositories are tracked by local Git clones
# (repos/ at the workspace root), with this machine's SSH key or Git credentials.
# git:
#   protocol: "ssh"          # "ssh" (git@github.com:…) or "https" (https://github.com/…)

# Diagnosis: per-commit signals to review by a human, never a verdict. Disabled by default:
# inform the people concerned before enabling it. Needs the local clones (repos/).
# diagnostic:
#   enabled: false           # true: signals measured at each sync
#   exclude: ["package-lock.json", "yarn.lock", "pnpm-lock.yaml", "go.sum", "poetry.lock", "Cargo.lock", "composer.lock", "Gemfile.lock", "vendor/", "node_modules/", "third_party/", "*.pb.go", "*_generated.*", "*.min.js", "dist/", "build/", "__snapshots__/", "*.snap"] # files left out of the measures ("vendor/": a directory; binaries always left out)
#   retention_days: 365      # days the signals are kept, from the commit date (1 to 3650)
#   speed_signal: false      # true: also the apparent speed signal (R4), fragile (legitimate copy-paste)

# Project conventions: compliance with the charter (commits, branches, pull requests, tags). Disabled by
# default. Shared by "watchoo config export", except enabled and excluded_accounts.
# conventions:
#   enabled: false           # true: conventions evaluated and displayed
#   since: ""                # start date "YYYY-MM-DD" (workspace time zone); empty: from the beginning
#   commit:
#     types: ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"] # accepted types (lowercase)
#     scopes: []             # accepted scopes; empty: any well-formed scope
#     max_subject_soft: 50   # subject length beyond which a warning is given
#     max_subject_hard: 72   # subject length beyond which the commit is not compliant
#     forbidden: ["update", "updates", "maj", "mise à jour", "wip", "test", "tests", "modif", "modifs", "modification", "modifications", "fix", "fixes", "correction", "corrections", "commit", "save", "tmp", "temp", "misc", "dépôt 1", "depot 1", ".", "..", "...", "initial commit", "first commit", "premier commit"] # forbidden subjects (whole subject, case ignored)
#     language: "any"        # expected language of the subjects, "fr", "en" or "any" (information only)
#   branch:
#     pattern: ""            # RE2 expression replacing the built-in rule "<type>/<words-with-dashes>"; empty: built-in rule
#     exclude: ["gh-pages", "dependabot/*", "renovate/*"] # branches left out (glob, the name or one of its path prefixes: "dependabot/*")
#   tags:
#     milestones: ["v1.0.0", "v2.0.0", "v3.0.0"] # milestones "vX.Y.Z", or "vX.Y.Z@YYYY-MM-DD" with a due date
#     prerelease_forms: ["rc", "beta", "alpha"] # compliant pre-releases "-<form>.N" (e.g. "v1.0.0-rc.1"); other forms give a warning
#   changelog:
#     categories_fr: true    # French CHANGELOG labels (Ajouté, [Non publié]…) accepted with a warning; false: deviations
#   readme:
#     sections: ["presentation", "group", "stack", "install", "run", "env", "tree", "license"] # expected README sections, among: presentation, group, stack, install, run, env, tree, license
#     min_words: 150         # number of words below which the README is too short
#   docs:
#     dir: "documentation"   # documentation folder, relative to the repository root
#     media_dir: "Media"     # media folder, under the documentation folder
#     archives_scope: "repository" # where archives are forbidden: "repository" (anywhere) or "documentation" (documentation folder only)
#   excluded_accounts: []    # accounts left out (trainer, bots…): login, name or e-mail
